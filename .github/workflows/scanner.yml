name: Autonomous Nexus Quant Market Scanner

on:
  schedule:
    - cron: '*/15 * * * *'  # Runs every 15 minutes automatically
  workflow_dispatch:        # Allows manual trigger from GitHub UI

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install All Terminal Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; else pip install pandas numpy psycopg2-binary python-dotenv yfinance requests; fi

      - name: Execute Cloud Market Scan
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scanner.py

name: 24/7 Nexus Quant Autopilot Cloud Worker

on:
  schedule:
    - cron: '*/5 * * * *' # Executes every 5 minutes in the cloud 24/7/365
  workflow_dispatch:

jobs:
  run-cloud-scanner:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy yfinance psycopg2-binary requests

      - name: Execute Market Scan & Multi-Source Cross Reference
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
        run: |
          python scanner.py
